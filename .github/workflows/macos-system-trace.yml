name: macOS full-suite native System Trace

on: workflow_dispatch

permissions:
  contents: read

jobs:
  trace:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: '26.5.0'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Preserve original verification prelude and compile host tests
        run: |
          npm run verify
          npm run compile-tests
      - name: Run one full host suite with bounded native tracing
        id: probe
        shell: bash
        run: |
          mkdir -p out
          node scripts/macos-system-trace.mts 2>&1 | tee out/macos-system-trace-console.log
      - name: Retain native trace and original logs on either outcome
        if: ${{ !cancelled() && (steps.probe.outcome == 'success' || steps.probe.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, MIT
        with:
          name: macos-system-trace-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/macos-system-trace-console.log
            out/macos-system-trace-*/
            out/integration-profile-*/logs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
