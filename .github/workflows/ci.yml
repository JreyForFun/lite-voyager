name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    name: Full verification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: '26.5.0'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Verify with virtual display on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run verify:full
      - name: Verify on Windows and macOS
        if: runner.os != 'Linux'
        run: npm run verify:full
