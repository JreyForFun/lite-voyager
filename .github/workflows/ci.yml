name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    name: Full verification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      LITE_VOYAGER_CI_DIAGNOSTICS: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: '26.5.0'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Verify with session bus and virtual display on Linux
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a npm run verify:full
      - name: Verify on Windows and macOS
        id: verify_desktop
        if: runner.os != 'Linux'
        run: npm run verify:full
      - name: Retain failed macOS diagnostics
        if: ${{ failure() && runner.os == 'macOS' && env.LITE_VOYAGER_CI_DIAGNOSTICS == '1' && steps.verify_desktop.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, MIT
        with:
          name: macos-verification-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/integration-profile-*/integration-console.log
            out/integration-profile-*/logs/
          if-no-files-found: error
          retention-days: 7
