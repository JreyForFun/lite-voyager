name: macOS focused JSON memory diagnostic

on: workflow_dispatch

permissions:
  contents: read

jobs:
  json-memory:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: '26.5.0'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Compile original tests and production bundles
        run: |
          npm run compile-tests
          npm run build
      - name: Run the exact populated JSON memory test once
        id: probe
        shell: bash
        run: |
          mkdir -p out
          node scripts/macos-json-memory-probe.mts 2>&1 | tee out/macos-json-memory-console.log
      - name: Retain diagnostic evidence on either outcome
        if: ${{ !cancelled() && (steps.probe.outcome == 'success' || steps.probe.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, MIT
        with:
          name: macos-json-memory-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/macos-json-memory-console.log
            out/integration-profile-macos-json-*/integration-console.log
            out/integration-profile-macos-json-*/json-memory-probe-status.json
            out/integration-profile-macos-json-*/logs/
          if-no-files-found: error
          retention-days: 7
